<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>蓝豆 LanDou · 蓝舌石龙子桌宠</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px;color:#18263b;font-family:"Segoe UI","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 15% 0,#dff7ff,transparent 30%),linear-gradient(145deg,#f3fbff,#edf1ff 52%,#fff8ee)}
    header,.card,.actions,footer{width:min(1100px,100%);margin:auto}header{display:flex;align-items:end;justify-content:space-between;margin-bottom:20px}header small{color:#3264df;font-weight:800;letter-spacing:.16em}h1{margin:5px 0 2px;font-size:clamp(34px,5vw,54px);letter-spacing:-.05em}h1 em{color:#3264df;font:500 .64em Georgia,serif}p{margin:0;color:#718096;font-size:13px}.mode{display:flex;align-items:center;gap:8px;padding:10px 14px;color:#2454c2;background:#fff;border:1px solid #cfd9ec;border-radius:999px;font-size:13px}.mode:before{width:8px;height:8px;content:"";background:#35b879;border-radius:50%;box-shadow:0 0 0 4px #35b87920}
    .card{overflow:hidden;background:#fff;border:1px solid #d8e0ea;border-radius:24px;box-shadow:0 28px 70px #48618a26}.bar{display:flex;justify-content:space-between;padding:15px 18px;color:#6e7e92;font-size:11px}.stage{position:relative;height:min(58vw,560px);min-height:410px;overflow:hidden;background:linear-gradient(#bcecff 0 68%,#8ed675 68% 80%,#66ae51)}.stage:before{position:absolute;top:45px;right:9%;width:62px;height:62px;content:"";background:#ffe48b;border:7px solid #ffffff70;border-radius:50%;box-shadow:0 0 0 20px #ffe48b2b}.stage:after{position:absolute;right:0;bottom:0;left:0;height:26%;content:"";background:linear-gradient(#75c35b,#4f9845);clip-path:polygon(0 20%,18% 4%,39% 22%,58% 0,79% 18%,100% 5%,100% 100%,0 100%)}
    #pet{position:absolute;z-index:2;width:192px;height:208px;padding:0;touch-action:none;background:transparent url("spritesheet.webp") no-repeat;border:0;cursor:grab;filter:drop-shadow(0 13px 9px #183e2c42)}#pet.dragging{cursor:grabbing;filter:drop-shadow(0 22px 14px #183e2c50)}.tip{position:absolute;z-index:3;bottom:12px;left:50%;padding:8px 12px;color:#fff;background:#1948309a;border-radius:999px;font-size:10px;transform:translateX(-50%);white-space:nowrap}
    .actions{margin-top:16px;padding:18px;background:#ffffffbd;border:1px solid #d8e0ea;border-radius:18px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:12px}.section-head span{display:grid;gap:3px}.section-head strong{font-size:15px}.section-head small{color:#7a899d;font-size:11px}.grid{display:grid;grid-template-columns:repeat(9,1fr);gap:7px}.grid button,.pose-grid button,.player button{color:#53657b;background:#fff;border:1px solid #dce3eb;border-radius:11px;cursor:pointer;transition:transform .13s ease,border-color .13s ease,color .13s ease}.grid button{display:grid;gap:3px;min-height:54px;padding:8px 5px}.grid button small{font-size:9px;opacity:.68}.grid button:hover,.pose-grid button:hover,.player button:hover{color:#2454c2;border-color:#8daaf0;transform:translateY(-1px)}.grid button.active{color:#fff;background:linear-gradient(145deg,#3970eb,#2855c6);border-color:transparent}.player{display:flex;align-items:center;gap:8px;margin:14px 0;padding:11px 12px;background:#f1f5fb;border-radius:13px}.player button{min-height:36px;padding:0 13px;font-weight:700}.player #play{min-width:108px;color:#fff;background:#245ed7;border-color:#245ed7}.player output{margin-left:auto;color:#61728a;font-size:11px;font-variant-numeric:tabular-nums}.pose-panel{padding:15px;background:#f8faff;border:1px solid #e2e8f3;border-radius:14px}.pose-head{display:flex;justify-content:space-between;gap:14px;margin-bottom:10px}.pose-head div{display:grid;gap:3px}.pose-head strong{font-size:14px}.pose-head small{color:#748399;font-size:10px}.pose-head button{align-self:center;padding:8px 11px;color:#2454c2;background:#e8efff;border:0;border-radius:9px;cursor:pointer}.pose-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.pose-grid button{display:grid;grid-template-columns:24px 1fr;align-items:center;gap:7px;min-height:46px;padding:7px 9px;text-align:left}.pose-grid button b{display:grid;place-items:center;width:24px;height:24px;color:#728299;background:#f0f3f8;border-radius:7px;font-size:9px}.pose-grid button span{font-size:11px}.pose-grid button.active{color:#204da9;background:#e9f0ff;border-color:#8ca9ed}.pose-grid button.active b{color:#fff;background:#3264df}footer{display:flex;justify-content:space-between;padding-top:14px;color:#8390a2;font-size:10px}@media(max-width:750px){body{padding:16px 10px}header{display:grid;gap:12px}.mode{width:max-content}.grid{grid-template-columns:repeat(3,1fr)}.pose-grid{grid-template-columns:repeat(2,1fr)}.stage{height:500px}.player{flex-wrap:wrap}.player output{width:100%;margin:2px 0 0;text-align:center}footer{display:grid;gap:4px;text-align:center}}@media(max-width:420px){.pose-grid{grid-template-columns:1fr}.section-head{align-items:start}.section-head>small{text-align:right}}
  </style>
</head>
<body>
  <header><div><small>ANIMATED DESKTOP BUDDY</small><h1>蓝豆 <em>LanDou</em></h1><p>一只会用钴蓝舌头表达心情的卡通蓝舌石龙子</p></div><span class="mode">手动动作模式</span></header>
  <section class="card"><div class="bar"><span>● 桌宠活动区</span><span id="status">发呆 · 放松微笑</span></div><div class="stage" id="stage"><button id="pet" title="拖动我；双击打招呼" aria-label="可拖动的蓝豆桌宠"></button><span class="tip">动作不会自动跳转 · 双击蓝豆可以挥爪</span></div></section>
  <section class="actions" aria-label="动作控制台">
    <div class="section-head"><span><small>动作库</small><strong>9 个动画组 · 61 个细分姿势</strong></span><small>选择后会持续播放，直到你手动更换</small></div>
    <div class="grid" id="actions"></div>
    <div class="player" aria-label="播放控制">
      <button id="previous" type="button">← 上一帧</button>
      <button id="play" type="button">暂停动画</button>
      <button id="next" type="button">下一帧 →</button>
      <output id="counter">第 1 / 6 帧</output>
    </div>
    <div class="pose-panel">
      <div class="pose-head"><div><strong id="pose-title">发呆的细分动作</strong><small id="pose-summary">放松微笑、轻微弹跳、慢眨眼、歪头、害羞收爪、回到循环起点</small></div><button id="play-group" type="button">播放整组</button></div>
      <div class="pose-grid" id="poses"></div>
    </div>
  </section>
  <footer><span>纯静态单文件应用 · 不会随机切换动作</span><span>1536 × 1872 透明 WebP 动画图集</span></footer>
  <script>
    const states={
      idle:{row:0,label:"发呆",summary:"放松微笑、轻微弹跳、慢眨眼、歪头、害羞收爪、回到循环起点",poses:["放松微笑","轻微弹跳","慢眨眼","好奇歪头","害羞收爪","回到起点"]},
      "running-right":{row:1,label:"向右跑",summary:"右向准备、四肢交替、压缩通过、身体弹起、腾空、落地、蹬地、回环",poses:["右向准备","右脚前伸","压缩通过","左脚前伸","开心腾空","轻巧落地","用力蹬地","回到起点"]},
      "running-left":{row:2,label:"向左跑",summary:"右向奔跑的镜像动作，保持花纹、四肢节奏和身体弹性",poses:["左向准备","左脚前伸","压缩通过","右脚前伸","开心腾空","轻巧落地","用力蹬地","回到起点"]},
      waving:{row:3,label:"挥爪",summary:"害羞站姿、抬起近侧前爪、闭眼大幅挥爪并短暂吐蓝舌、放下前爪回环",poses:["害羞站姿","抬起前爪","闭眼大幅挥爪","放爪回环"]},
      jumping:{row:4,label:"跳跃",summary:"下蹲蓄力、起跳、四爪收起到达最高点并吐蓝舌、下降、柔软压缩落地",poses:["下蹲蓄力","向上起跳","最高点吐舌","轻巧下降","柔软落地"]},
      failed:{row:5,label:"委屈",summary:"惊讶、紧张合爪、贴脸眼泪、低头、闭眼趴下、偷看、恢复希望、害羞微笑",poses:["惊讶张嘴","紧张合爪","贴脸眼泪","低头失落","闭眼趴下","悄悄偷看","恢复希望","害羞微笑"]},
      waiting:{row:6,label:"等待",summary:"仰头等待、向左歪头、抬起前爪询问、吐蓝舌微笑、轻弹、耐心回环",poses:["仰头等待","向左歪头","抬爪询问","吐舌微笑","害羞轻弹","耐心回环"]},
      running:{row:7,label:"冲刺",summary:"正面准备、向画面右侧踏步、向左侧踏步、腾空、向前冲刺吐蓝舌、回环",poses:["正面准备","向右踏步","向左踏步","正面腾空","吐舌冲刺","回到起点"]},
      review:{row:8,label:"检查",summary:"好奇、前爪托腮、前倾检查、慢眨眼思考、满意点头、平静回环",poses:["好奇观察","前爪托腮","前倾检查","慢眨眼思考","满意点头","平静回环"]}
    };
    const pet=document.querySelector("#pet"),stage=document.querySelector("#stage"),status=document.querySelector("#status"),actions=document.querySelector("#actions"),poses=document.querySelector("#poses"),playButton=document.querySelector("#play"),previousButton=document.querySelector("#previous"),nextButton=document.querySelector("#next"),counter=document.querySelector("#counter"),poseTitle=document.querySelector("#pose-title"),poseSummary=document.querySelector("#pose-summary"),playGroup=document.querySelector("#play-group");
    let state="idle",frame=0,x=120,y=30,playing=true,drag=null;
    function renderPoseButtons(){const current=states[state];poses.replaceChildren();current.poses.forEach((label,index)=>{const button=document.createElement("button"),number=document.createElement("b"),text=document.createElement("span");button.type="button";button.dataset.frame=index;number.textContent=String(index+1).padStart(2,"0");text.textContent=label;button.append(number,text);button.onclick=()=>{frame=index;playing=false;draw()};poses.append(button)});poseTitle.textContent=`${current.label}的细分动作`;poseSummary.textContent=current.summary}
    function draw(){const current=states[state];pet.style.backgroundPosition=`${-frame*192}px ${-current.row*208}px`;pet.style.left=x+"px";pet.style.bottom=y+"px";status.textContent=`${current.label} · ${current.poses[frame]}`;pet.setAttribute("aria-label",`蓝豆正在${current.label}：${current.poses[frame]}`);actions.querySelectorAll("button").forEach(button=>button.classList.toggle("active",button.dataset.state===state));poses.querySelectorAll("button").forEach(button=>button.classList.toggle("active",Number(button.dataset.frame)===frame));playButton.textContent=playing?"暂停动画":"继续播放";counter.textContent=`第 ${frame+1} / ${current.poses.length} 帧`}
    function selectState(next){state=next;frame=0;playing=true;renderPoseButtons();draw()}
    Object.entries(states).forEach(([key,value])=>{const button=document.createElement("button"),label=document.createElement("span"),count=document.createElement("small");button.type="button";button.dataset.state=key;label.textContent=value.label;count.textContent=`${value.poses.length} 帧`;button.append(label,count);button.onclick=()=>selectState(key);actions.append(button)});
    playButton.onclick=()=>{playing=!playing;draw()};playGroup.onclick=()=>{frame=0;playing=true;draw()};previousButton.onclick=()=>{playing=false;frame=(frame-1+states[state].poses.length)%states[state].poses.length;draw()};nextButton.onclick=()=>{playing=false;frame=(frame+1)%states[state].poses.length;draw()};
    setInterval(()=>{if(!playing)return;frame=(frame+1)%states[state].poses.length;draw()},140);
    pet.addEventListener("pointerdown",event=>{pet.setPointerCapture(event.pointerId);drag={px:event.clientX,py:event.clientY,x,y};pet.classList.add("dragging")});window.addEventListener("pointermove",event=>{if(!drag)return;x=Math.max(0,Math.min(stage.clientWidth-192,drag.x+event.clientX-drag.px));y=Math.max(0,Math.min(stage.clientHeight-208,drag.y-event.clientY+drag.py));draw()});window.addEventListener("pointerup",()=>{drag=null;pet.classList.remove("dragging")});pet.addEventListener("dblclick",()=>selectState("waving"));renderPoseButtons();draw();
  </script>
</body>
</html>
