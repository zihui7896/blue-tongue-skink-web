<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>蓝豆 LanDou · 蓝舌石龙子桌宠</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px;color:#18263b;font-family:"Segoe UI","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 15% 0,#dff7ff,transparent 30%),linear-gradient(145deg,#f3fbff,#edf1ff 52%,#fff8ee)}
    header,.card,.actions,footer{width:min(1100px,100%);margin:auto}header{display:flex;align-items:end;justify-content:space-between;margin-bottom:20px}header small{color:#3264df;font-weight:800;letter-spacing:.16em}h1{margin:5px 0 2px;font-size:clamp(34px,5vw,54px);letter-spacing:-.05em}h1 em{color:#3264df;font:500 .64em Georgia,serif}p{margin:0;color:#718096;font-size:13px}.toggle{padding:10px 14px;color:#2454c2;background:#fff;border:1px solid #cfd9ec;border-radius:999px;cursor:pointer}
    .card{overflow:hidden;background:#fff;border:1px solid #d8e0ea;border-radius:24px;box-shadow:0 28px 70px #48618a26}.bar{display:flex;justify-content:space-between;padding:15px 18px;color:#6e7e92;font-size:11px}.stage{position:relative;height:min(58vw,560px);min-height:410px;overflow:hidden;background:linear-gradient(#bcecff 0 68%,#8ed675 68% 80%,#66ae51)}.stage:before{position:absolute;top:45px;right:9%;width:62px;height:62px;content:"";background:#ffe48b;border:7px solid #ffffff70;border-radius:50%;box-shadow:0 0 0 20px #ffe48b2b}.stage:after{position:absolute;right:0;bottom:0;left:0;height:26%;content:"";background:linear-gradient(#75c35b,#4f9845);clip-path:polygon(0 20%,18% 4%,39% 22%,58% 0,79% 18%,100% 5%,100% 100%,0 100%)}
    #pet{position:absolute;z-index:2;width:192px;height:208px;padding:0;touch-action:none;background:transparent url("spritesheet.webp") no-repeat;border:0;cursor:grab;filter:drop-shadow(0 13px 9px #183e2c42)}#pet.dragging{cursor:grabbing;filter:drop-shadow(0 22px 14px #183e2c50)}.tip{position:absolute;z-index:3;bottom:12px;left:50%;padding:8px 12px;color:#fff;background:#1948309a;border-radius:999px;font-size:10px;transform:translateX(-50%);white-space:nowrap}
    .actions{margin-top:16px;padding:17px;background:#ffffffbd;border:1px solid #d8e0ea;border-radius:18px}.actions strong{display:block;margin-bottom:11px}.grid{display:grid;grid-template-columns:repeat(9,1fr);gap:7px}.grid button{min-height:50px;color:#53657b;background:#fff;border:1px solid #dce3eb;border-radius:11px;cursor:pointer}.grid button.active{color:#fff;background:linear-gradient(145deg,#3970eb,#2855c6);border-color:transparent}footer{display:flex;justify-content:space-between;padding-top:14px;color:#8390a2;font-size:10px}@media(max-width:750px){body{padding:16px 10px}header{display:grid;gap:12px}.grid{grid-template-columns:repeat(3,1fr)}.stage{height:500px}footer{display:grid;gap:4px;text-align:center}}
  </style>
</head>
<body>
  <header><div><small>ANIMATED DESKTOP BUDDY</small><h1>蓝豆 <em>LanDou</em></h1><p>一只会用钴蓝舌头表达心情的卡通蓝舌石龙子</p></div><button class="toggle" id="auto">自动巡游：开</button></header>
  <section class="card"><div class="bar"><span>● 桌宠活动区</span><span id="status">轻轻呼吸，偶尔眨眼</span></div><div class="stage" id="stage"><button id="pet" title="拖动我；双击打招呼" aria-label="可拖动的蓝豆桌宠"></button><span class="tip">拖动蓝豆到任意位置 · 双击它会挥爪</span></div></section>
  <section class="actions"><strong>动作库 · 9 个完整动画状态</strong><div class="grid" id="actions"></div></section>
  <footer><span>纯静态单文件应用 · 可直接双击打开</span><span>1536 × 1872 透明 WebP 动画图集</span></footer>
  <script>
    const states={idle:[0,6,"发呆","轻轻呼吸，偶尔眨眼"],"running-right":[1,8,"向右跑","贴着桌面巡游"],"running-left":[2,8,"向左跑","折返继续巡游"],waving:[3,4,"挥爪","短短前爪也能打招呼"],jumping:[4,5,"跳跃","开心时会腾空一下"],failed:[5,8,"委屈","失败后会慢慢振作"],waiting:[6,6,"等待","歪头等你下一步"],running:[7,6,"冲刺","从正面哒哒跑来"],review:[8,6,"检查","认真看看任务结果"]};
    const pet=document.querySelector("#pet"),stage=document.querySelector("#stage"),status=document.querySelector("#status"),actions=document.querySelector("#actions"),autoButton=document.querySelector("#auto");let state="idle",frame=0,x=120,y=30,auto=true,drag=null,randomTimer;
    function draw(){const s=states[state];pet.style.backgroundPosition=`${-frame*192}px ${-s[0]*208}px`;pet.style.left=x+"px";pet.style.bottom=y+"px";status.textContent=s[3];document.querySelectorAll(".grid button").forEach(b=>b.classList.toggle("active",b.dataset.state===state))}
    function change(next){state=next;frame=0;draw();clearTimeout(randomTimer);schedule()}
    Object.entries(states).forEach(([key,value])=>{const button=document.createElement("button");button.dataset.state=key;button.textContent=`${value[2]} · ${value[1]}帧`;button.onclick=()=>change(key);actions.append(button)});
    function schedule(){if(!auto||drag)return;randomTimer=setTimeout(()=>{const keys=["idle","waving","jumping","waiting","review","running-right","running-left"].filter(k=>k!==state);change(keys[Math.floor(Math.random()*keys.length)])},2800+Math.random()*2200)}
    setInterval(()=>{frame=(frame+1)%states[state][1];if(auto&&!drag&&(state==="running-right"||state==="running-left")){x+=state==="running-right"?7:-7;const max=Math.max(0,stage.clientWidth-192);if(x<=0){x=0;state="running-right"}if(x>=max){x=max;state="running-left"}}draw()},110);
    pet.addEventListener("pointerdown",e=>{pet.setPointerCapture(e.pointerId);drag={px:e.clientX,py:e.clientY,x,y};pet.classList.add("dragging")});window.addEventListener("pointermove",e=>{if(!drag)return;x=Math.max(0,Math.min(stage.clientWidth-192,drag.x+e.clientX-drag.px));y=Math.max(0,Math.min(stage.clientHeight-208,drag.y-e.clientY+drag.py));draw()});window.addEventListener("pointerup",()=>{drag=null;pet.classList.remove("dragging");schedule()});pet.addEventListener("dblclick",()=>change("waving"));autoButton.onclick=()=>{auto=!auto;autoButton.textContent=`自动巡游：${auto?"开":"关"}`;schedule()};draw();schedule();
  </script>
</body>
</html>
